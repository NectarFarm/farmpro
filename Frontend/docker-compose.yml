name: ifms

# One command brings up the whole system:
#   docker compose up --build
# Order: db (Postgres) → migrate (runs drizzle migrations + seed, then exits) → app.
# App on http://localhost:13000 · Postgres on localhost:55432.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ifms}
      POSTGRES_DB: ifms
    volumes:
      - ifms_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ifms"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: apply schema migrations, then seed. Idempotent (safe to re-run).
  migrate:
    build:
      context: .
      target: builder
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-ifms}@db:5432/ifms
      # Super-admin login printed at startup. Override these for production.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ifms.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-demo1234}
      # SEED_DEMO=false → seed ONLY the admin (no demo owner/workers).
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Startup test gate: runs unit + integration against a real app+DB. The `app`
  # service only starts if this exits 0, so red tests block the containers.
  tests:
    build:
      context: .
      target: builder
    command: sh scripts/ci-gate.sh
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-ifms}@db:5432/ifms
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-session-secret-please}
      # The integration suite fires many rapid requests per identifier/IP — well
      # above real-traffic rate-limit thresholds. Loosen all three limiters here
      # (never in the `app` service) so the test gate exercises actual behavior
      # instead of tripping over its own request volume.
      RATE_LIMIT_LOGIN_MAX: 500
      RATE_LIMIT_LOGIN_IP_MAX: 2000
      RATE_LIMIT_WRITE_MAX: 2000
      RATE_LIMIT_READ_MAX: 2000
      NEXT_PUBLIC_USE_REAL_API: "true"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_USE_REAL_API: "true"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-ifms}@db:5432/ifms
      # Override SESSION_SECRET in production with a long random value.
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-session-secret-please}
      NEXT_PUBLIC_USE_REAL_API: "true"
      # Keep cookies non-Secure so login works over plain HTTP (http://<lan-ip>:13000).
      # Set to "true" ONLY when serving over HTTPS behind a TLS reverse proxy.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
    ports:
      - "${APP_PORT:-13000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tests:
        condition: service_completed_successfully

volumes:
  ifms_pgdata:
    name: ifms_pgdata

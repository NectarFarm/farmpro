name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Type Check ────────────────────────────────────────────────────────
  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

  # ── Job 2: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

  # ── Job 3: Build ─────────────────────────────────────────────────────────────
  # Verifies the Next.js build compiles without error.
  # All pages are "use client" so no DB connection is needed at build time.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Placeholder values — no real DB needed during build (client-only pages).
          DATABASE_URL: postgresql://farmpro:farmpro_secret@localhost:5432/farmpro
          SESSION_SECRET: ci-placeholder-secret-minimum-32-characters-long
          NEXT_PUBLIC_API_URL: http://localhost:13000
          # Suppress Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1

  # ── Job 4: Unit Tests ────────────────────────────────────────────────────────
  # Uncomment and configure once Vitest is installed (pnpm add -D vitest).

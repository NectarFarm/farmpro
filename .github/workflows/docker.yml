name: Docker Build

# Only runs on PRs targeting main — it's a heavier check that validates
# the full production image builds and the compose stack wires up correctly.
on:
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job: Docker Compose Build ────────────────────────────────────────────────
  # Builds all services defined in docker-compose.yml and runs a health check
  # against the app container to confirm it starts cleanly.
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build all images (does not start containers — validates the Dockerfile stages)
      - name: Build images
        run: docker compose build
        env:
          SESSION_SECRET: ci-docker-secret-minimum-32-characters-long
          DATABASE_URL: postgresql://farmpro:farmpro_secret@db:5432/farmpro

      # Start the full stack (db → migrate → app)
      - name: Start stack
        run: docker compose up -d
        env:
          SESSION_SECRET: ci-docker-secret-minimum-32-characters-long
          DATABASE_URL: postgresql://farmpro:farmpro_secret@db:5432/farmpro

      # Wait for the app to pass its health check (max 90s)
      - name: Wait for app health
        run: |
          echo "Waiting for farmpro health check..."
          for i in $(seq 1 18); do
            STATUS=$(docker compose ps --format json farmpro 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo "unknown")
            echo "Attempt $i: health=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "App is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy within 90s"
          docker compose logs farmpro
          exit 1

      # Confirm the health API responds correctly
      - name: Smoke test health endpoint
        run: |
          RESPONSE=$(curl -sf http://localhost:13000/api/health)
          echo "Health response: $RESPONSE"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
